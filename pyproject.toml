[project]
name = "meshtui"
version = "0.1.0"
description = "Terminal-based 3D mesh viewer using Kitty graphics protocol"
readme = "README.md"
authors = [
    { name = "Dennis Madsen", email = "madsendennis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "trimesh>=4.0.0",
    "pyrender>=0.1.45",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyglet>=2.0.0",
]

[project.scripts]
meshtui = "meshtui.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = false
allow_redefinition = true
strict_optional = false
ignore_missing_imports = true
disallow_any_explicit = false
disallow_any_unimported = false
